{% extends "base.html" %}
{% block title %}{% if task %}Edit Task{% else %}Add Task{% endif %}{% endblock %}
{% block content %}
<h2>{% if task %}Edit Task{% else %}Add a New Task{% endif %}</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ task.category if task else 'General' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-select">
            <option {% if task and task.priority=='Low' %}selected{% endif %}>Low</option>
            <option {% if not task or task.priority=='Medium' %}selected{% endif %}>Medium</option>
            <option {% if task and task.priority=='High' %}bg-danger selected{% endif %}>High</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Due Date</label>
        <input type="date" name="due_date" class="form-control" value="{{ task.due_date if task else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Task</button>
</form>
{% endblock %}
